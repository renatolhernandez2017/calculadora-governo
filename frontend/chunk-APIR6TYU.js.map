<form [formGroup]="form">

    <div class="rtc-padding-10">

        <div class="rtc-flex rtc-margin-bottom-20">
            <div class="rtc-flex-item-90">
                <div class="rtc-titulo-forte">
                    <span>Assistente de Geração</span>
                </div>
                <div class="rtc-subtitulo">
                    <span>Obtenha e valide grupos de tributação de CBS, IBS e IS para documentos fiscais eletrônicos em formato XML.</span>
                </div>
            </div>
            <div class="rtc-flex-item-10 rtc-text-align-right">
                <button type="button" class="br-button small circle" (click)="fechar()"><i
                        class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <!-- <gerador-validador-xml [modo]="'gerador'"></gerador-validador-xml> -->
        <gerador-validador-xml *ngIf="xmlService.tiposDeDocumentoGeracao.length > 0" [tipoValues]="xmlService.tiposDeDocumentoGeracao" [modo]="'gerador'" [subtipo]="'GRUPO'"></gerador-validador-xml>
        
    </div>
</form>
