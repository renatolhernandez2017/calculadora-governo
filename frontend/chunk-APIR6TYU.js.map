<div class="rtc-padding-10">

    <div class="rtc-flex rtc-margin-bottom-20">
        <div class="rtc-flex-item-75">
            <div class="rtc-titulo-forte">
                <span>Geração de QRCode</span>
            </div>
        </div>
        <div class="rtc-flex-item-25 rtc-text-align-right">
            <button class="br-button small circle" (click)="fechar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>

    <hr>

    <div class="rtc-grid">
        <div *ngIf="imageUrl" class="rtc-grid-item-12 rtc-text-align-center">
            <img [src]="imageUrl" alt="QR Code" style="max-width: 100%; max-height: 400px;" />
        </div>
        <div class="rtc-grid-item-12 rtc-text-align-center">
            <hr>
            <button type="button" class="br-button secondary" (click)="baixar()">
                <span><i class="fa-solid fa-download"></i></span>
                <span>&nbsp;&nbsp;</span>
                <span>Baixar</span>
            </button>
        </div>
    </div>

</div>
