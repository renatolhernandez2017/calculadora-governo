<div class="captcha-container">
  <button #hcaptchaButton 
          type="button"
          ngHcaptchaInvisibleButton 
          [siteKey]="siteKey"
          (verify)="handleVerify($event)"
          (expired)="handleExpired($event)"
          (error)="handleError($event)"
          style="display: none;">
  </button>
</div>
