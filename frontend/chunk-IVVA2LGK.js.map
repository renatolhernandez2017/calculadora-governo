<div>

    @if (dispositivo == 'device-xsmall') {
    <ng-container *ngTemplateOutlet="resultadoGrid4"></ng-container>
    } @else if (dispositivo == 'device-small' || dispositivo == 'device-medium') {
    <ng-container *ngTemplateOutlet="resultadoGrid8"></ng-container>
    } @else {
    <ng-container *ngTemplateOutlet="resultadoGrid12"></ng-container>
    }

</div>

<ng-template #resultadoGrid4>
    <div class="rtc-grid rtc-margin-bottom-10 rtc-margin-top-20">
        <div class="rtc-grid-item-4">
            <button type="submit" class="br-button primary rtc-width-100">
                <span><i class="fa-solid fa-calculator"></i></span>
                <span>&nbsp;&nbsp;</span>
                <span>Calcular</span>
            </button>
        </div>
        <div class="rtc-grid-item-4">
            <button type="button" class="br-button secondary rtc-width-100" (click)="limpar()">
                <span><i class="fa-solid fa-eraser"></i></span>
                <span>&nbsp;&nbsp;</span>
                <span>Limpar</span>
            </button>
        </div>
        <div class="rtc-grid-item-4">
            <button (click)="voltar()" type="button" class="br-button tertiary rtc-width-100">
                <span><i class="fa-solid fa-arrow-left"></i></span>
                <span>&nbsp;&nbsp;</span>
                <span>Voltar</span>
            </button>
        </div>
    </div>
</ng-template>

<ng-template #resultadoGrid8>
    <div class="rtc-grid rtc-margin-bottom-10">
        <div class="rtc-grid-item-6">
            <div class="rtc-flex-center-1">
                <div class="rtc-text-align-left rtc-width-100">
                    <button (click)="voltar()" type="button" class="br-button tertiary rtc-margin-10">
                        <span><i class="fa-solid fa-arrow-left"></i></span>
                        <span>&nbsp;&nbsp;</span>
                        <span>Voltar</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="rtc-grid-item-6 rtc-text-align-right">
            <button type="button" class="br-button secondary rtc-margin-10" (click)="limpar()">
                <span><i class="fa-solid fa-eraser"></i></span>
                <span>&nbsp;&nbsp;</span>
                <span>Limpar</span>
            </button>
            <button type="submit" class="br-button primary rtc-margin-10">
                <span><i class="fa-solid fa-calculator"></i></span>
                <span>&nbsp;&nbsp;</span>
                <span>Calcular</span>
            </button>
        </div>
    </div>
</ng-template>

<ng-template #resultadoGrid12>
    <div class="rtc-grid rtc-margin-bottom-10">
        <div class="rtc-grid-item-6">
            <div class="rtc-flex-center-1">
                <div class="rtc-text-align-left rtc-width-100">
                    <button (click)="voltar()" type="button" class="br-button tertiary rtc-margin-10">
                        <span><i class="fa-solid fa-arrow-left"></i></span>
                        <span>&nbsp;&nbsp;</span>
                        <span>Voltar</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="rtc-grid-item-6 rtc-text-align-right">
            <button type="button" class="br-button secondary rtc-margin-10" (click)="limpar()">
                <span><i class="fa-solid fa-eraser"></i></span>
                <span>&nbsp;&nbsp;</span>
                <span>Limpar</span>
            </button>
            <button type="submit" class="br-button primary rtc-margin-10">
                <span><i class="fa-solid fa-calculator"></i></span>
                <span>&nbsp;&nbsp;</span>
                <span>Calcular</span>
            </button>
        </div>
    </div>
</ng-template>
