<form [formGroup]="form">
    <div class="rtc-titulo rtc-margin-top-10 rtc-margin-bottom-10">
        <span>Informações sobre NBS</span>
    </div>
    <div *ngIf="response" class="rtc-grid" style="gap: 0;">
        <div class="rtc-grid-item-6">
            <ng-container *ngTemplateOutlet="colunaEsquerdaTemplate; context: { response: response }"></ng-container>
        </div>
        <div class="rtc-grid-item-6">
            <ng-container *ngTemplateOutlet="colunaDireitaTemplate; context: { response: response }"></ng-container>
        </div>
    </div>
</form>

<ng-template #colunaEsquerdaTemplate let-response="response">
    <div class="rtc-titulo rtc-gray-background rtc-padding-10">
        <span>Descrição</span>
    </div>
    <div class="rtc-margin-10">
        <div *ngIf="response?.capitulo != null" class="rtc-margin-top-10">
            <b><span>Capítulo&nbsp;</span></b>
            <br>
            <span [innerHTML]="response?.capitulo"></span>
        </div>
        <div *ngIf="response?.posicao != null" class="rtc-margin-top-10">
            <b><span>Posição&nbsp;</span></b>
            <br>
            <span [innerHTML]="response?.posicao"></span>
        </div>
        <div *ngIf="response?.subposicao1 != null" class="rtc-margin-top-10">
            <b><span>Subposição 1&nbsp;</span></b>
            <br>
            <span [innerHTML]="response?.subposicao1"></span>
        </div>
        <div *ngIf="response?.subposicao2 != null" class="rtc-margin-top-10">
            <b><span>Subposição 2&nbsp;</span></b>
            <br>
            <span [innerHTML]="response?.subposicao2"></span>
        </div>
        <div *ngIf="response?.item != null" class="rtc-margin-top-10">
            <b><span>Item&nbsp;</span></b>
            <br>
            <span [innerHTML]="response?.item"></span>
        </div>
    </div>
</ng-template>

<ng-template #colunaDireitaTemplate let-response="response">
    <div class="rtc-titulo rtc-gray-background rtc-padding-10">
        <span>Tributação</span>
    </div>
    <div class="rtc-margin-10">
        <div class="rtc-margin-top-10">
            <span><b>Tributado pelo IS na data da consulta</b>&nbsp;</span>
            <br>
            <span>{{response?.tributadoPeloImpostoSeletivo == true ? 'Sim' : 'Não'}}</span>
        </div>
        <div *ngIf="response?.aliquotaAdValorem != null" class="rtc-margin-top-10">
            <span><b>Alíquota Ad Valorem</b>&nbsp;</span>
            <br>
            <span>{{response?.aliquotaAdValorem | number: '1.0-4'}}%</span>
        </div>
    </div>
</ng-template>
