<div class="rtc-grid">
    <div class="rtc-grid-item-12">
        <br-table #brTable title="Lista de Fundamentações" [headerHeight]="70" [paginationPlacement]="'bottom'"
            [headerButtonDetail]="true" [scrollbarH]="false" [scrollbarV]="false" (rowExpanded)="onRowExpanded($event)"
            [rowExpandableFn]="rowExpandableFn" [autoExpanded]="autoExpanded" [detailTemplate]="detailTemplate"
            [columnMode]="ColumnMode.flex" [sortable]="false" paginationType="CONTEXTUAL" [(pageSize)]="pageSize"
            [(currentPage)]="currentPage" [actions]="tableActions" [data]="dadosFiltrados" [columns]="tableColumns"
            [export]="export" [filtered]="true" [rowFilterAtTitleBar]="false">

            <div slot-title class="custom-title-actions">
                <button tooltip="Baixar todos os dados da tabela" class="br-button circle" type="button"
                    (click)="baixarDadosJSON()" aria-label="Baixar todos os dados da tabela">
                    <i class="fas fa-download" aria-hidden="true"></i>
                </button>
            </div>

            <div slot-filter class="custom-filter-box">
                <form [formGroup]="form" (ngSubmit)="aplicarFiltro()">
                    <div *ngIf="dispositivo === 'device-small' || dispositivo === 'device-medium' || dispositivo === 'device-large' || dispositivo === 'device-xlarge'"
                        class="rtc-grid">
                        <div class="rtc-grid-item-6">
                            <br-input density="large" label="Código" [autocomplete]="'off'" name="codigoControl"
                                formControlName="codigoControl"></br-input>
                        </div>
                        <div class="rtc-grid-item-6">
                            <br-input density="large" label="Descrição" [autocomplete]="'off'" name="descricaoControl"
                                formControlName="descricaoControl"></br-input>
                        </div>
                        <div class="rtc-grid-item-12">
                            <div class="rtc-flex">
                                <div class="rtc-flex-item-33 rtc-text-align-left">
                                    <button class="br-button secondary" type="button" (click)="fecharFiltro()">
                                        <i class="fa-solid fa-xmark"></i>
                                        &nbsp;&nbsp;Fechar
                                    </button>
                                </div>
                                <div class="rtc-flex-item-66 rtc-text-align-right">
                                    <button class="br-button secondary" type="button" (click)="limparFiltro()">
                                        <i class="fa-solid fa-eraser"></i>
                                        &nbsp;&nbsp;Limpar
                                    </button>
                                    <button class="br-button primary" type="submit">
                                        <i class="fa-solid fa-filter"></i>
                                        &nbsp;&nbsp;Filtrar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div *ngIf="dispositivo === 'device-xsmall'" class="rtc-grid">
                        <div class="rtc-grid-item-4">
                            <br-input density="large" label="Código" [autocomplete]="'off'" name="codigoControl"
                                formControlName="codigoControl"></br-input>
                        </div>
                        <div class="rtc-grid-item-4">
                            <br-input density="large" label="Descrição" [autocomplete]="'off'" name="descricaoControl"
                                formControlName="descricaoControl"></br-input>
                        </div>
                        <div class="rtc-grid-item-4">
                            <button class="br-button primary rtc-width-100" type="submit">
                                <i class="fa-solid fa-filter"></i>
                                &nbsp;&nbsp;Filtrar
                            </button>
                        </div>
                        <div class="rtc-grid-item-4">
                            <button class="br-button secondary rtc-width-100" type="button" (click)="limparFiltro()">
                                <i class="fa-solid fa-eraser"></i>
                                &nbsp;&nbsp;Limpar
                            </button>
                        </div>
                        <div class="rtc-grid-item-4">
                            <button class="br-button secondary rtc-width-100" type="button" (click)="fecharFiltro()">
                                <i class="fa-solid fa-xmark"></i>
                                &nbsp;&nbsp;Fechar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </br-table>
    </div>
</div>

<ng-template #detailTemplate let-row="row">
    <div class="rtc-grid compact-container">
        <div class="rtc-grid-item-12">
            <div *ngIf="dispositivo === 'device-xsmall'">
                <div>
                    <b><span>cClassTrib&nbsp;&nbsp;&nbsp;</span></b>
                    <br>
                    <span [innerText]="row?.codigoClassificacaoTributaria"></span>
                </div>
                <br>
                <div>
                    <b><span>Descrição cClassTrib&nbsp;&nbsp;&nbsp;</span></b>
                    <br>
                    <span [innerText]="row?.descricaoClassificacaoTributaria"></span>
                </div>
                <br>
                <div>
                    <b><span>CST&nbsp;&nbsp;&nbsp;</span></b>
                    <br>
                    <span [innerText]="row?.codigoSituacaoTributaria"></span>
                </div>
                <br>
                <div>
                    <b><span>Descrição CST&nbsp;&nbsp;&nbsp;</span></b>
                    <br>
                    <span [innerText]="row?.descricaoSituacaoTributaria"></span>
                </div>
                <br>
                <div *ngIf="row?.textoCurto">
                    <b><span>Texto Curto&nbsp;&nbsp;&nbsp;</span></b>
                    <br>
                    <span [innerText]="row?.textoCurto"></span>
                </div>
                <hr>
            </div>
            <div *ngIf="row?.conjuntoTributo">
                <b><span>Tributo(s)&nbsp;&nbsp;&nbsp;</span></b>
                <br>
                <span [innerText]="row?.conjuntoTributo"></span>
            </div>
            <br>
            <div *ngIf="row?.texto">
                <b><span>Texto&nbsp;&nbsp;&nbsp;</span></b>
                <br>
                <span [innerText]="formatarTexto(row?.texto)"></span>
            </div>
            <br>
            <div>
                <b><span>Referência Normativa&nbsp;&nbsp;&nbsp;</span></b>
                <br>
                <span [innerText]="formatarTexto(row?.referenciaNormativa)"></span>
            </div>
        </div>
    </div>
</ng-template>
