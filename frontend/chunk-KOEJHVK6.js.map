<form [formGroup]="form">
    <div class="rtc-padding-10">
        <div *ngIf="tipoValues != null" class="rtc-grid">
            <div class="rtc-grid-item-6">
                <br-select [required]="true" name="tipoControl" label="Tipo" [values]="tipoValues" itemLabel="nome"
                    itemValue="mnemonico" formControlName="tipoControl" [valueMaxWidth]="60" appendTo="" [clearable]="false" [searchable]="false">
                </br-select>
            </div>
            <div class="rtc-grid-item-6">
                <label class="br-label">Versão Nota Técnica</label>
                <div class="br-input">
                    <input type="text" [value]="getVersaoNotaTecnica()" readonly>
                </div>
            </div>
        </div>
        <div class="monaco-editor-wrapper">
            <div class="monaco-editor-container">
                <ngx-monaco-editor [options]="editorOptions" formControlName="xmlControl"
                    style="height: 100%; width: 100%;">
                </ngx-monaco-editor>
            </div>
        </div>
        <div *ngIf="resposta != null || erro != null">
            <hr>
            <div *ngIf="resposta != null" class="rtc-titulo rtc-padding-10">
                <span><i class="fa-solid fa-circle-check" style="color: green;"></i></span>
                <span>&nbsp;&nbsp;</span>
                <span>{{sucesso}}</span>
            </div>
            <div *ngIf="erro != null" class="rtc-titulo rtc-padding-10">
                <span><i class="fa-solid fa-ban" style="color: red;"></i></span>
                <span>&nbsp;&nbsp;</span>
                <span>Erro na geração do XML.</span>
                <div class="rtc-destacado">
                    <span>{{ erro.detail }}</span>
                </div>
            </div>
            <hr>
        </div>
        <div *ngIf="!(dispositivo === 'device-xsmall')" class="rtc-flex">
            <div class="rtc-flex-item-25 rtc-text-align-left">
                <button type="button" class="br-button secondary rtc-margin-10" (click)="apagar()">
                    <i class="fa-solid fa-trash"></i>&nbsp;&nbsp;
                    <span>Apagar</span>
                </button>
            </div>
            <div class="rtc-flex-item-75 rtc-text-align-right">
                <button type="button" class="br-button secondary rtc-margin-10" (click)="organizar()">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>&nbsp;&nbsp;
                    <span>Organizar</span>
                </button>
                <button type="button" class="br-button secondary rtc-margin-10" (click)="copiar()">
                    <i class="fa-solid fa-copy"></i>&nbsp;&nbsp;
                    <span>Copiar</span>
                </button>
                <button type="button" class="br-button secondary rtc-margin-10" (click)="colar()">
                    <i class="fa-solid fa-paste"></i>&nbsp;&nbsp;
                    <span>Colar</span>
                </button>
                <button *ngIf="modo === 'validador'" type="submit" class="br-button primary rtc-margin-10" (click)="onSubmit('validar')">
                    <i class="fa-solid fa-check"></i>&nbsp;&nbsp;
                    <span>Validar</span>
                </button>
                <button *ngIf="modo === 'gerador'" type="submit" class="br-button secondary rtc-margin-10" (click)="onSubmit('validar')">
                    <i class="fa-solid fa-check"></i>&nbsp;&nbsp;
                    <span>Validar</span>
                </button>
                <button *ngIf="modo === 'gerador'" type="submit" class="br-button primary rtc-margin-10"
                    (click)="onSubmit('restaurar')">
                    <i class="fa-solid fa-code"></i>&nbsp;&nbsp;
                    <span>Gerar</span>
                </button>
            </div>
        </div>
        <div *ngIf="(dispositivo === 'device-xsmall')" class="rtc-grid">
            <div class="rtc-grid-item-4 rtc-text-align-center">
                <div style="display: flex; justify-content: space-between;">
                    <button tooltip="Apagar" type="button" class="br-button secondary circle" (click)="apagar()">
                        <i class="fa-solid fa-trash"></i>
                        <!-- <span>Apagar</span> -->
                    </button>
                    <button tooltip="Organizar" type="button" class="br-button secondary circle" (click)="organizar()">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <!-- <span>Organizar</span> -->
                    </button>
                    <button tooltip="Copiar" type="button" class="br-button secondary circle" (click)="copiar()">
                        <i class="fa-solid fa-copy"></i>
                        <!-- <span>Copiar</span> -->
                    </button>
                    <button tooltip="Colar" type="button" class="br-button secondary circle" (click)="colar()">
                        <i class="fa-solid fa-paste"></i>
                        <!-- <span>Colar</span> -->
                    </button>
                </div>
            </div>
            <div class="rtc-grid-item-4 rtc-text-align-center">
                <button *ngIf="modo === 'gerador'" type="submit" class="br-button primary rtc-width-100 rtc-margin-bottom-10"
                    (click)="onSubmit('restaurar')">
                    <i class="fa-solid fa-code"></i>&nbsp;&nbsp;
                    <span>Gerar</span>
                </button>
                <button *ngIf="modo === 'validador'" type="submit" class="br-button primary rtc-width-100" (click)="onSubmit('validar')">
                    <i class="fa-solid fa-check"></i>&nbsp;&nbsp;
                    <span>Validar</span>
                </button>
                <button *ngIf="modo === 'gerador'" type="submit" class="br-button secondary rtc-width-100" (click)="onSubmit('validar')">
                    <i class="fa-solid fa-check"></i>&nbsp;&nbsp;
                    <span>Validar</span>
                </button>
            </div>
        </div>
    </div>
</form>
