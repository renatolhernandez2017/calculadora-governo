<form [formGroup]="form" (ngSubmit)="calcular()">
    <div class="rtc-grid">
        <div class="rtc-grid-item-12">
            <my-title [titulo]="'Pedágio'" [descricao]="'Simule o cálculo dos tributos devidos na operação de pedágio'">
            </my-title>
        </div>
    </div>
    <div class="rtc-grid rtc-elevacao-1 rtc-padding-10 rtc-margin-bottom-20">
        <div class="rtc-grid-item-12">
            <div class="rtc-titulo-forte">
                <span>
                    Operação de Pedágio
                </span>
            </div>
            <div class="rtc-subtitulo">
                <span>
                    Informações sobre a operação de pedágio
                </span>
            </div>
        </div>
        <div class="rtc-grid-item-6">
            <br-date-picker label="Ocorrência" formControlName="dataControl" #datePicker [required]="true">
            </br-date-picker>
        </div>
        <div class="rtc-grid-item-6">
            <br-input formControlName="valorOperacaoControl" label="Valor da Operação (sem tributos)" required="true"
                [currency]="13.2" icon="fa-solid fa-brazilian-real-sign">
            </br-input>
        </div>
    </div>
    <div class="rtc-grid rtc-elevacao-1 rtc-padding-10 rtc-margin-bottom-20">
        <div class="rtc-grid-item-12">
            <br-accordion [data]="accordion"></br-accordion>
        </div>
    </div>
    <div class="rtc-grid rtc-elevacao-1 rtc-padding-10 rtc-margin-bottom-20">
        <div class="rtc-grid-item-12">
            <br-accordion [data]="accordionTrechos"></br-accordion>
        </div>
    </div>
    <div class="rtc-grid">
        <div class="rtc-grid-item-12">
            <barra-botoes [onButtonClick]="limpar"></barra-botoes>
        </div>
    </div>
    <div *ngIf="calculadoraOutput != null" class="rtc-grid rtc-elevacao-1 rtc-padding-10 rtc-margin-bottom-20">
        <div class="rtc-grid-item-12">
            <simulador-calculo-pedagio-resultado [header]="header" [dados]="dados" [municipiosOk]="municipiosOk" [estadosOk]="estadosOk"
                [rows]="rows" [calculadoraOutput]="calculadoraOutput">
            </simulador-calculo-pedagio-resultado>
        </div>
    </div>
</form>

<ng-template #tributacaoTemplate>
    <form [formGroup]="form">
        <div class="rtc-grid">
            <div class="rtc-grid-item-6">
                <br-select name="cstControl" label="Situação Tributária (CST)" [values]="cstValues"
                    itemLabel="label" formControlName="cstControl" appendTo="" [valueMaxWidth]="selectValueMaxWidth" [clearable]="false">
                </br-select>
            </div>
            <div class="rtc-grid-item-6">
                <br-select name="cClassTribControl" label="Classificação Tributária (cClassTrib)"
                    [values]="cClassTribValues" itemLabel="label" formControlName="cClassTribControl" appendTo=""
                    [clearable]="false" [valueMaxWidth]="selectValueMaxWidth">
                </br-select>
            </div>
        </div>
    </form>
</ng-template>

<ng-template #adicionarTrechoTemplate>
    <form [formGroup]="form">
        <div class="rtc-grid rtc-gray-background rtc-padding-10">
            <div class="rtc-grid-item-1">
                <br-select [required]="true" name="ufTrecho" label="UF"
                    [values]="ufTrechoValues" itemLabel="sigla" [valueMaxWidth]="selectValueMaxWidth"
                    formControlName="ufTrechoControl" appendTo="" [clearable]="false">
                </br-select>
            </div>
            <div class="rtc-grid-item-7">
                <br-select [required]="false" name="municipioTrecho" label="Município"
                    [values]="municipioTrechoValues" itemLabel="nome" [valueMaxWidth]="selectValueMaxWidth"
                    formControlName="municipioTrechoControl"
                    appendTo="" [clearable]="false">
                </br-select>
            </div>
            <div class="rtc-grid-item-2">
                <br-input formControlName="extensaoControl"
                    label="Extensão (km)" required="true" [currency]="13.2">
                </br-input>
            </div>
            <div class="rtc-grid-item-2 rtc-text-align-right">
                <div class="rtc-flex-center-2">
                    <button id="botao-calcular" type="button" class="br-button secondary rtc-width-100" (click)="incluirTrecho()">
                        <span><i class="fa-solid fa-plus"></i></span>
                        <span>&nbsp;&nbsp;</span>
                        <span>Incluir Trecho</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="rtc-grid">
            <div class="rtc-grid-item-12 rtc-light-gray-background rtc-padding-10">
                <div class="rtc-flex">
                    <div [ngClass]="dispositivo != 'device-xsmall' ? 'rtc-flex-item-20' :  'rtc-flex-item-20'">
                        <span><b>Trecho</b></span>
                    </div>
                    <div [ngClass]="dispositivo != 'device-xsmall' ? 'rtc-flex-item-20' :  'rtc-flex-item-25'">
                        <span><b>Extensão</b></span>
                    </div>
                    <div [ngClass]="dispositivo != 'device-xsmall' ? 'rtc-flex-item-50' :  'rtc-flex-item-40'">
                        <span><b>Local</b></span>
                    </div>
                    <div [ngClass]="dispositivo != 'device-xsmall' ? 'rtc-flex-item-10 rtc-text-align-right' :  'rtc-flex-item-15 rtc-text-align-right'">
                        <span><b>Ação</b></span>
                    </div>
                </div>
            </div>
            <div class="rtc-grid-item-12 rtc-padding-10">
                <div *ngFor="let x of rows; index as i">
                    <ng-container
                        *ngTemplateOutlet="trechoTemplate; context: { trecho: x, i: i, output: calculadoraOutput?.trechos[i] }"></ng-container>
                </div>
            </div>
        </div>
    </form>
</ng-template>

<ng-template #trechoTemplate let-trecho="trecho" let-i="i" let-output="output">
    <div class="rtc-flex">
        <div [ngClass]="dispositivo != 'device-xsmall' ? 'rtc-flex-item-20' :  'rtc-flex-item-20'">
            <span><b>{{i+1}}</b></span>
        </div>
        <div [ngClass]="dispositivo != 'device-xsmall' ? 'rtc-flex-item-20' :  'rtc-flex-item-25'">
            <span>{{trecho.extensao}}&nbsp;km</span>
        </div>
        <div [ngClass]="dispositivo != 'device-xsmall' ? 'rtc-flex-item-50' :  'rtc-flex-item-40'">
            <span>{{trecho?.nomeMunicipio + ' - ' + trecho?.uf}}</span>
        </div>
        <div [ngClass]="dispositivo != 'device-xsmall' ? 'rtc-flex-item-10 rtc-text-align-right' :  'rtc-flex-item-15 rtc-text-align-right'">
            <button (click)="excluirTrecho(i)" tooltip="Excluir trecho" type="button" class="br-button xsmall circle">
                <i style="margin-top: 3px;" class="fa-solid fa-trash fa-xm"></i>
            </button>
        </div>
    </div>
    <hr>
</ng-template>
