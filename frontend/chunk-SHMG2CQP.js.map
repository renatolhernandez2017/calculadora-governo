<div class="rtc-grid rtc-padding-10">
    <div class="rtc-grid-item-12">
        <my-title [titulo]="'Alíquotas'"
            [descricao]="'Consulte as alíquotas próprias e de referência para CBS e IBS.'">
        </my-title>
    </div>
    <div class="rtc-grid-item-12">
        <br-tab-set (activeChange)="onTabActiveChange($event)">
            <br-tab name="União" [active]="true">
                <div class="rtc-padding-5">
                    <consultar-aliquotas-uniao></consultar-aliquotas-uniao>
                </div>
            </br-tab>
            <br-tab name="Estados">
                <div class="rtc-padding-5">
                    <consultar-aliquotas-estado></consultar-aliquotas-estado>
                </div>
            </br-tab>
            <br-tab name="Municípios">
                <div class="rtc-padding-5">
                    <consultar-aliquotas-municipio></consultar-aliquotas-municipio>
                </div>
            </br-tab>
        </br-tab-set>
    </div>
</div>
