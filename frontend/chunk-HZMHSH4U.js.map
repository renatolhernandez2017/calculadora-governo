<ng-container *ngIf="route.firstChild == null">
    <div>
        <my-title [titulo]="'Calculadora'"
            [descricao]="'Simule o valor da base de cálculo e dos tributos devidos em operações de consumo de bens e serviços.'">
        </my-title>
    </div>
    <div class="rtc-flex-center flex-wrap rtc-gap-20">
        <my-card imagem="./assets/cards/simulador_calculo_320x200.png" titulo="Regime Geral"
            descricao="Simule os tributos devidos em operações de consumo de bens e serviços, nos Regimes Geral, Diferenciados e Específicos."
            url="calculadora/regime-geral">
        </my-card>
        <my-card imagem="./assets/cards/simulador_pedagio_320x200.png" titulo="Pedágio"
            descricao="Simule os tributos devidos em operações de pedágio." url="calculadora/pedagio">
        </my-card>
        <my-card imagem="./assets/cards/simulador_split_payment_simplificado_320x200.png" titulo="Simplificado"
            descricao="Simule os tributos devidos em operações com Split Payment Simplificado."
            url="calculadora/simplificado">
        </my-card>
        <my-card imagem="./assets/cards/simulador_base_calculo_320x200.png" titulo="Bases de Cálculo"
            descricao="Simule a base de cálculo em operações de consumo de bens e serviços."
            url="calculadora/bases-de-calculo">
        </my-card>
    </div>
    <div class="rtc-grid rtc-gap-0 rtc-elevacao-1 rtc-margin-top-20 rtc-margin-bottom-20 rtc-padding-10">
        <div class="rtc-grid-item-12 rtc-titulo rtc-margin-bottom-10">
            <span>Mais Informações</span>
        </div>
        <div class="rtc-grid-item-12 rtc-subtitulo">
            <span>Consulte dados e informações usados pelos simuladores para chegar ao valor do tributo.</span>
        </div>
        <div class="rtc-grid-item-12 rtc-align-itens-center rtc-botao-acesso-grande rtc-border-bottom-1"
            routerLink="validador-xml">
            <div class="rtc-flex rtc-align-itens-center rtc-height-60px rtc-padding-left-10 rtc-padding-right-10">
                <div class="rtc-flex-item-75">
                    <span><i class="fa-solid fa-spell-check"></i>&nbsp;&nbsp;Assistente de Validação</span>
                </div>
                <div class="rtc-flex-item-25 rtc-text-align-right">
                    <span><i class="fa-solid fa-angle-right"></i></span>
                </div>
            </div>
        </div>
        <div class="rtc-grid-item-12 rtc-align-itens-center rtc-botao-acesso-grande rtc-border-bottom-1"
            routerLink="fundamentacoes-legais">
            <div class="rtc-flex rtc-align-itens-center rtc-height-60px rtc-padding-left-10 rtc-padding-right-10">
                <div class="rtc-flex-item-75">
                    <span><i class="fa-solid fa-scale-balanced"></i>&nbsp;&nbsp;Fundamentações Legais</span>
                </div>
                <div class="rtc-flex-item-25 rtc-text-align-right">
                    <span><i class="fa-solid fa-angle-right"></i></span>
                </div>
            </div>
        </div>
        <div class="rtc-grid-item-12 rtc-align-itens-center rtc-botao-acesso-grande rtc-border-bottom-1"
            routerLink="classificacoes-tributarias">
            <div class="rtc-flex rtc-align-itens-center rtc-height-60px rtc-padding-left-10 rtc-padding-right-10">
                <div class="rtc-flex-item-75">
                    <span><i class="fa-solid fa-file-lines"></i>&nbsp;&nbsp;Classificações Tributárias</span>
                </div>
                <div class="rtc-flex-item-25 rtc-text-align-right">
                    <span><i class="fa-solid fa-angle-right"></i></span>
                </div>
            </div>
        </div>
        <div class="rtc-grid-item-12 rtc-align-itens-center rtc-botao-acesso-grande rtc-border-bottom-1"
            routerLink="aliquotas">
            <div class="rtc-flex rtc-align-itens-center rtc-height-60px rtc-padding-left-10 rtc-padding-right-10">
                <div class="rtc-flex-item-75">
                    <span><i class="fa-solid fa-percent"></i>&nbsp;&nbsp;Alíquotas</span>
                </div>
                <div class="rtc-flex-item-25 rtc-text-align-right">
                    <span><i class="fa-solid fa-angle-right"></i></span>
                </div>
            </div>
        </div>
        <div class="rtc-grid-item-12 rtc-align-itens-center rtc-botao-acesso-grande rtc-border-bottom-1"
            routerLink="nomenclaturas">
            <div class="rtc-flex rtc-align-itens-center rtc-height-60px rtc-padding-left-10 rtc-padding-right-10">
                <div class="rtc-flex-item-75">
                    <span><i class="fa-solid fa-cart-shopping"></i>&nbsp;&nbsp;Nomenclatura (NCM e NBS)</span>
                </div>
                <div class="rtc-flex-item-25 rtc-text-align-right">
                    <span><i class="fa-solid fa-angle-right"></i></span>
                </div>
            </div>
        </div>
        <!-- <div class="rtc-grid-item-12 rtc-align-itens-center rtc-botao-acesso-grande rtc-border-bottom-1"
            routerLink="compras-governamentais">
            <div class="rtc-flex rtc-align-itens-center rtc-height-60px rtc-padding-left-10 rtc-padding-right-10">
                <div class="rtc-flex-item-75">
                    <span><i class="fa-solid fa-money-bill-transfer"></i>&nbsp;&nbsp;Compras Governamentais</span>
                </div>
                <div class="rtc-flex-item-25 rtc-text-align-right">
                    <span><i class="fa-solid fa-angle-right"></i></span>
                </div>
            </div>
        </div> -->
        <div class="rtc-grid-item-12 rtc-align-itens-center rtc-botao-acesso-grande rtc-border-bottom-1"
            routerLink="documentacao">
            <div class="rtc-flex rtc-align-itens-center rtc-height-60px rtc-padding-left-10 rtc-padding-right-10">
                <div class="rtc-flex-item-75">
                    <span><i class="fa-solid fa-book"></i>&nbsp;&nbsp;Documentação da API de Integração</span>
                </div>
                <div class="rtc-flex-item-25 rtc-text-align-right">
                    <span><i class="fa-solid fa-angle-right"></i></span>
                </div>
            </div>
        </div>
        <div class="rtc-grid-item-12 rtc-align-itens-center rtc-botao-acesso-grande"
            routerLink="calculadora-offline">
            <div class="rtc-flex rtc-align-itens-center rtc-height-60px rtc-padding-left-10 rtc-padding-right-10">
                <div class="rtc-flex-item-75">
                    <span><i class="fa-solid fa-download"></i>&nbsp;&nbsp;Calculadora Offline</span>
                </div>
                <div class="rtc-flex-item-25 rtc-text-align-right">
                    <span><i class="fa-solid fa-angle-right"></i></span>
                </div>
            </div>
        </div>
    </div>
</ng-container>

<router-outlet></router-outlet>
