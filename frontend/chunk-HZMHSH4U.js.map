<div class="rtc-flex-card rtc-elevacao-1">
    <div class="rtc-flex-column border-radius-8 rtc-height-100">
        <div>
            <div>
                <img class="rtc-margin-bottom-10" [src]="imagem" [alt]="titulo" width="280" height="187" />
            </div>
        </div>
        <div>
            <div class="rtc-titulo-forte rtc-padding-10">
                <span>{{titulo}}</span>
            </div>
        </div>
        <div>
            <div class="rtc-subtitulo rtc-padding-10">
                <span>{{descricao}}</span>
            </div>
        </div>
        <div class="rtc-card-bottom">
            <div class="rtc-text-align-center rtc-padding-bottom-10 rtc-padding-left-10 rtc-padding-right-10">
                <button type="button" class="br-button tertiary rtc-width-100" (click)="irPara(url)" [disabled]="!habilitado">
                    <span>Acessar</span>
                </button>
            </div>
        </div>
    </div>
</div>
