<form [formGroup]="form" (ngSubmit)="calcular()">
    <div class="rtc-grid rtc-gap-20">
        <div class="rtc-grid-item-12">
            <my-title [titulo]="'Simulador de Split Payment Simplificado'"
                [descricao]="'Calcule os tributos devidos nas operações de consumo de bens e serviços'">
            </my-title>
        </div>
        <div class="rtc-grid-item-12 rtc-elevacao-1 rtc-padding-10">
            <div class="rtc-grid">
                <div class="rtc-grid-item-4">
                    <br-date-picker label="Data da Operação" [brMinDate]="minDate" formControlName="dataControl" (input)="dataControlInput($event)"
                        #datePicker [required]="true">
                    </br-date-picker>
                </div>
                <div class="rtc-grid-item-4">
                    <br-select [required]="true" name="cnpjCpfControl" label="CPF / CNPJ" [values]="cnpjCpf"
                        itemLabel="label" formControlName="cadastroControl" appendTo=""
                        [clearable]="false">
                    </br-select>
                </div>
                <div class="rtc-grid-item-4">
                    <br-input formControlName="baseCalculoControl" label="Valor Pago" required="true"
                        [currency]="13.2">
                    </br-input>
                </div>
            </div>
        </div>
    </div>
    <div class="rtc-grid">
        <div class="rtc-grid-item-12">
            <barra-botoes [onButtonClick]="limpar"></barra-botoes>
        </div>
    </div>
    <div class="rtc-grid rtc-elevacao-1 rtc-margin-bottom-20">
        <div *ngIf="calculadoraOutput" class="rtc-grid-item-12 rtc-padding-10">
            <simulador-simplificado-resultado [dados]="calculadoraOutput"></simulador-simplificado-resultado>
        </div>
    </div>
</form>

<ng-template #cadastroTemplate>
    <div style="text-align: left;">
        <div><span>Exemplos:</span></div>
        <div><span>5F5CNBWQ402521</span></div>
    </div>
</ng-template>
