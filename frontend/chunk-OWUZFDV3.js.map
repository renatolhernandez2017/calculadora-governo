<div class="rtc-grid rtc-padding-10">
    <div class="rtc-grid-item-12">
        <my-title [titulo]="'Assistente de Validação'"
            [descricao]="'Valide grupos de tributação de CBS, IBS e IS ou o documento fiscal completo em formato XML.'">
        </my-title>
    </div>
    <div class="rtc-grid-item-12">
        <br-tab-set>
            <br-tab [name]="dispositivo === 'device-xsmall' ? 'Notas' : 'Notas Fiscais'" [active]="true">
                <div class="rtc-padding-5">
                    <validador-nota></validador-nota>
                </div>
            </br-tab>
            <br-tab [name]="dispositivo === 'device-xsmall' ? 'Grupos' : 'Grupos de Tributação'">
                <div class="rtc-padding-5">
                    <validador-grupo></validador-grupo>
                </div>
            </br-tab>
        </br-tab-set>
    </div>
    <div class="rtc-grid-item-12 rtc-margin-bottom-20">
        <div *ngIf="dispositivo === 'device-xsmall'">
            <button class="br-button tertiary rtc-width-100" (click)="voltar()">
                <i class="fa-solid fa-arrow-left"></i>
                &nbsp;&nbsp;Voltar
            </button>
        </div>
        <div *ngIf="dispositivo === 'device-small' || dispositivo === 'device-medium' || dispositivo === 'device-large' || dispositivo === 'device-xlarge'" class="rtc-text-align-left">
            <button class="br-button tertiary" (click)="voltar()">
                <i class="fa-solid fa-arrow-left"></i>
                &nbsp;&nbsp;Voltar
            </button>
        </div>
    </div>
</div>
