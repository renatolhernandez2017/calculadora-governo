<div class="rtc-grid">
    <div class="rtc-grid-item-12">
        <my-title [titulo]="'Compras Governamentais'"
            [descricao]="'Consulte os percentuais de destinação da CBS e IBS (art. 373 LC 214/25) e de redução de alíquota em Compras Governamentais (art. 472 LC 214/25).'">
        </my-title>
    </div>
    <div class="rtc-grid-item-12">
        <form [formGroup]="form" (ngSubmit)="submit($event)">
            <!-- <div *ngIf="dispositivo === 'device-small' || dispositivo === 'device-medium' || dispositivo === 'device-large' || dispositivo === 'device-xlarge'" class="form-consulta-container">
                <div class="date-picker-wrapper">
                    <br-date-picker label="Ocorrência" formControlName="dataControl" #datePicker [required]="true">
                    </br-date-picker>
                </div>
                <div class="button-wrapper">
                    <button id="botao-calcular" type="submit" class="br-button primary">
                        <span><i class="fa-solid fa-search"></i></span>
                        <span>&nbsp;&nbsp;</span>
                        <span>Consultar</span>
                    </button>
                </div>
            </div> -->
            <div *ngIf="dispositivo === 'device-xsmall'" class="rtc-grid">
                <!-- <div class="rtc-grid-item-4">
                    <br-date-picker label="Ocorrência" formControlName="dataControl" #datePicker [required]="true">
                    </br-date-picker>
                </div>
                <div class="rtc-grid-item-4">
                    <button id="botao-calcular" type="submit" class="br-button primary rtc-width-100">
                        <span><i class="fa-solid fa-search"></i></span>
                        <span>&nbsp;&nbsp;</span>
                        <span>Consultar</span>
                    </button>
                </div> -->
            </div>
        </form>
    </div>
    <div class="rtc-grid-item-12 rtc-elevacao-1 rtc-margin-top-10 rtc-padding-10">
        <br-tab-set (activeChange)="onTabActiveChange($event)">
            <br-tab #brTabConsultarTransferenciasCbs [name]="nomeTabConsultarTransferenciasCbs" [active]="true">
                <div style="overflow-y: hidden;">
                    <consultar-transferencias-cbs
                        [dataConsulta]="dataConsulta"></consultar-transferencias-cbs>
                </div>
            </br-tab>
            <br-tab #brTabConsultarRedutoresCompraGovernamental [name]="nomeTabConsultarRedutoresCompraGovernamental">
                <div style="overflow-y: hidden;">
                    <consultar-redutores-compra-governamental
                        [dataConsulta]="dataConsulta"></consultar-redutores-compra-governamental>
                </div>
            </br-tab>
        </br-tab-set>
    </div>
    <div class="rtc-grid-item-12 rtc-margin-bottom-20">
        <div *ngIf="dispositivo === 'device-xsmall'">
            <button class="br-button tertiary rtc-width-100" (click)="voltar()">
                <i class="fa-solid fa-arrow-left"></i>
                &nbsp;&nbsp;Voltar
            </button>
        </div>
        <div *ngIf="dispositivo === 'device-small' || dispositivo === 'device-medium' || dispositivo === 'device-large' || dispositivo === 'device-xlarge'" class="rtc-text-align-left">
            <button class="br-button tertiary" (click)="voltar()">
                <i class="fa-solid fa-arrow-left"></i>
                &nbsp;&nbsp;Voltar
            </button>
        </div>
    </div>
</div>
