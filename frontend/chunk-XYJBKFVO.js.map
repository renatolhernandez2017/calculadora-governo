<div class="rtc-grid">
    <div class="rtc-grid-item-12">
        <br-table #brTable title="Lista de Percentuais de Redução" [headerHeight]="70" [paginationPlacement]="'bottom'"
            [scrollbarH]="false" [scrollbarV]="false"
            [columnMode]="ColumnMode.flex" [sortable]="false" paginationType="CONTEXTUAL" [(pageSize)]="pageSize"
            [(currentPage)]="currentPage" [actions]="tableActions" [data]="dadosFiltrados" [columns]="tableColumns"
            [export]="export">
            <div slot-title class="custom-title-actions">
                <button tooltip="Baixar todos os dados da tabela" class="br-button circle" type="button"
                    (click)="baixarDadosJSON()" aria-label="Baixar todos os dados da tabela">
                    <i class="fas fa-download" aria-hidden="true"></i>
                </button>
            </div>
        </br-table>
    </div>
</div>

<ng-template #detailTemplate let-row="row">
</ng-template>


<ng-template #vigenciaTemplate let-row="row" let-rowIndex="rowIndex" let-value="value">
    <div>
        <span [attr.id-teste]="'vigencia-' + rowIndex">{{formatarData(value)}}</span>
    </div>
</ng-template>

<ng-template #valorTemplate let-row="row" let-rowIndex="rowIndex" let-value="value">
    <div>
        <span [attr.id-teste]="'valor-' + rowIndex">{{ value | number: '1.0-4' }}%</span>
    </div>
</ng-template>
