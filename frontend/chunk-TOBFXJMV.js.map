<form [formGroup]="form" (ngSubmit)="submit($event)">

    <div class="rtc-grid rtc-padding-bottom-10">
        <div class="rtc-grid-item-4">
            <br-select
                label="Ano do Fato Gerador"
                [values]="yearValues"
                itemLabel="label"
                formControlName="anoFatoGeradorControl"
                [required]="true"
                [clearable]="false"
                [searchable]="false"
                density="small"
                appendTo="body">
            </br-select>
        </div>
    </div>

    <div class="rtc-grid" style="align-items: start;">
        <div class="rtc-grid-item-6 rtc-elevacao-1 rtc-padding-10">
            <div class="rtc-grid rtc-align-itens-center">
                <div class="rtc-grid-item-12 rtc-titulo rtc-padding-10">
                    <span><i class="fa-solid fa-circle-check" style="color: green;"></i></span>
                    <span>&nbsp;&nbsp;</span>
                    <span>Valores que integram a base</span>
                </div>
                <div class="rtc-grid-item-6">
                    <span>Valor do Serviço</span>
                </div>
                <div class="rtc-grid-item-6">
                    <br-input [placeholder]="''" [formControlName]="'valorServicoControl'" [required]="true"
                        [mask]="'money'" [currency]="16.2">
                    </br-input>
                </div>
            </div>
        </div>
        <div class="rtc-grid-item-6">
            <div class="rtc-grid rtc-elevacao-1 rtc-padding-10 rtc-align-itens-center">
                <div class="rtc-grid-item-12 rtc-titulo rtc-padding-10">
                    <span><i class="fa-solid fa-ban" style="color: red;"></i></span>
                    <span>&nbsp;&nbsp;</span>
                    <span>Valores que não integram a base</span>
                </div>
                <div class="rtc-grid-item-6">
                    <span>Desconto Incondicional</span>
                </div>
                <div class="rtc-grid-item-6">
                    <br-input [placeholder]="''" [formControlName]="'descontoIncondicionalControl'" [required]="true" [mask]="'money'"
                        [currency]="16.2">
                    </br-input>
                </div>
                <div class="rtc-grid-item-6">
                    <span>Reembolso, repasse ou ressarcimento</span>
                    <span [tooltip]="tooltipReembolso" placement="right">
                        <i class="fa-solid fa-circle-info" style="color: #1351b4; cursor: help; margin-left: 5px;"></i>
                    </span>
                </div>
                <div class="rtc-grid-item-6">
                    <br-input [placeholder]="''" [formControlName]="'vCalcReeRepResControl'" [required]="true" [mask]="'money'"
                        [currency]="16.2">
                    </br-input>
                </div>
                <div class="rtc-grid-item-6">
                    <span>Deduções e reduções</span>
                    <span [tooltip]="tooltipDeducoes" placement="right">
                        <i class="fa-solid fa-circle-info" style="color: #1351b4; cursor: help; margin-left: 5px;"></i>
                    </span>
                </div>
                <div class="rtc-grid-item-6">
                    <br-input [placeholder]="''" [formControlName]="'vCalcDedRedIBSCBSControl'" [required]="true" [mask]="'money'"
                        [currency]="16.2">
                    </br-input>
                </div>
                <div class="rtc-grid-item-6" *ngIf="!isAnoApos2032()">
                    <span>ISS</span>
                    <!-- <span [tooltip]="tooltipISS" placement="right">
                        <i class="fa-solid fa-circle-info" style="color: #1351b4; cursor: help; margin-left: 5px;"></i>
                    </span> -->
                </div>
                <div class="rtc-grid-item-6" *ngIf="!isAnoApos2032()">
                    <br-input [placeholder]="''" [formControlName]="'issControl'" [required]="true" [mask]="'money'"
                        [currency]="16.2">
                    </br-input>
                </div>
                <div class="rtc-grid-item-6" *ngIf="!isAnoApos2026()">
                    <span>PIS</span>
                </div>
                <div class="rtc-grid-item-6" *ngIf="!isAnoApos2026()">
                    <br-input [placeholder]="''" [formControlName]="'pisControl'" [required]="true" [mask]="'money'"
                        [currency]="16.2">
                    </br-input>
                </div>
                <div class="rtc-grid-item-6" *ngIf="!isAnoApos2026()">
                    <span>Cofins</span>
                </div>
                <div class="rtc-grid-item-6" *ngIf="!isAnoApos2026()">
                    <br-input [placeholder]="''" [formControlName]="'cofinsControl'" [required]="true" [mask]="'money'"
                        [currency]="16.2">
                    </br-input>
                </div>
            </div>
            <div class="rtc-grid rtc-elevacao-1 rtc-padding-10 rtc-align-itens-center rtc-margin-top-20" *ngIf="response">
                <div class="rtc-grid-item-12">
                    <div class="rtc-grid">
                        <div class="rtc-grid-item-12 rtc-titulo rtc-padding-10">
                            Resultado
                        </div>
                        <div class="rtc-grid-item-6 rtc-padding-10">
                            <span>Valor da Base de Cálculo</span>
                        </div>
                        <div class="rtc-grid-item-6 rtc-padding-10">
                            <div class="rtc-text-align-right">
                                <span>{{response?.baseCalculo | currency: 'BRL'}}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="rtc-grid">
        <div class="rtc-grid-item-12">
            <barra-botoes [onButtonClick]="limpar"></barra-botoes>
        </div>
    </div>


</form>
